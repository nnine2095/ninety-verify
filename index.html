<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{META_TITLE}}</title>

    <meta property="og:title" content="{{META_TITLE}}" />
    <meta property="og:description" content="{{META_DESC}}" />
    <meta name="description" content="{{META_DESC}}" />

    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: #0f0f0f;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #ffffff; 
            padding: 20px; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }

        .step1-container {
            max-width: 440px;
            width: 100%;
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
        }

        .row-2col {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .info-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #ffffff;
            border-radius: 18px;
            padding: 15px 10px;
            text-align: center;
        }

        .info-box-full {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #ffffff;
            border-radius: 18px;
            padding: 15px;
            text-align: center;
            margin-bottom: 25px;
        }

        .info-title {
            font-size: 14px;
            color: #aaaaaa;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .info-value {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            word-break: break-all;
        }

        .btn-action {
            background-color: #ff0d19;
            color: #ffffff;
            border: 2px solid #000000;
            padding: 16px;
            font-size: 20px;
            font-weight: 700;
            font-family: 'Prompt', sans-serif;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 5px 15px rgba(255, 13, 25, 0.4);
        }

        .btn-action:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .step2-wrapper {
            display: none;
            width: 100%;
            max-width: 440px;
            flex-direction: column;
            align-items: center;
        }

        .outer-card { 
            width: 100%; 
            background: #2b2b2b; 
            border-radius: 24px; 
            padding: 35px 25px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); 
            text-align: center; 
            position: relative;
        }

        .logo-img { max-width: 200px; height: auto; margin-bottom: 20px; }
        .logo-text { font-size: 24px; font-weight: 700; color: #ff0d19; letter-spacing: 2px; margin-bottom: 15px; text-transform: uppercase; }
        
        /* สไตล์ของตัวนับเวลาถอยหลัง */
        .timer-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 8px 15px;
            font-size: 14px;
            color: #ff4d4d;
            font-weight: 600;
            margin-bottom: 20px;
            display: inline-block;
        }

        .inner-card { background: #1c1c1c; border-radius: 16px; padding: 30px 20px; }
        .card-label { font-size: 13px; color: #aaaaaa; margin-bottom: 12px; }
        .netflix-code { font-size: 58px; font-weight: 700; color: #ff0d19; letter-spacing: 6px; margin: 10px 0 25px 0; text-shadow: 0 0 20px rgba(255, 13, 25, 0.4); }
        .copy-btn { background-color: #ff0d19; color: #ffffff; border: none; padding: 14px 20px; font-size: 16px; font-weight: 700; font-family: 'Prompt', sans-serif; border-radius: 30px; cursor: pointer; transition: all 0.2s ease; width: 100%; }
        .copy-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .email-date { font-size: 12px; color: #888888; margin-top: 20px; }
        .no-code { font-size: 15px; color: #aaaaaa; padding: 20px 0; }

        .alert-box {
            margin-top: 25px;
            width: 100%;
            background: #ffffff;
            border: 3px solid #000000;
            border-radius: 20px;
            padding: 12px 20px;
            text-align: center;
            color: #000000;
            font-size: 18px;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .music-control {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.15);
            border: none;
            color: #fff;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            display: none;
            font-family: 'Prompt';
        }
    </style>
</head>
<body>

    <div id="step1" class="step1-container">
        <button id="btn-music-step1" class="music-control" onclick="toggleMusic()">🔊 ปิดเพลง</button>
        
        <div class="row-2col">
            <div class="info-box">
                <div class="info-title">Screen</div>
                <div class="info-value" id="val-screen">-</div>
            </div>
            <div class="info-box">
                <div class="info-title">PIN</div>
                <div class="info-value" id="val-pin">-</div>
            </div>
        </div>

        <div class="info-box-full">
            <div class="info-title">Mail</div>
            <div class="info-value" id="val-mail">-</div>
        </div>

        <button class="btn-action" id="btn-goto-step2" onclick="goToStep2()">รับรหัสยืนยัน</button>
    </div>

    <div id="step2" class="step2-wrapper">
        <div class="outer-card">
            <button id="btn-music-step2" class="music-control" onclick="toggleMusic()">🔊 ปิดเพลง</button>
            
            <div id="logo-container">
                <div class="logo-text" id="logo-text">VERIFICATION CODE</div>
            </div>

            <!-- แสดงตัวนับเวลาถอยหลัง 15 นาที -->
            <div class="timer-box" id="timer-display">
                ⏳ ลิงก์หมดอายุใน: <span id="time-left">15:00</span> นาที
            </div>

            <div id="email-list">กำลังรอดึงรหัส...</div>
        </div>

        <div class="alert-box">
            หากคัดลอกแล้วลิงก์จะหมดอายุทันที
        </div>
    </div>

    <audio id="bg-audio" loop></audio>

    <script>
        const currentToken = window.location.pathname.split('/').pop();
        let bgAudio = document.getElementById('bg-audio');
        let countdownTimer = null;
        const EXPIRE_MINUTES = 15; // กำหนดเวลาหมดอายุ 15 นาที

        async function loadTheme() {
            try {
                const res = await fetch(`/api/theme/${currentToken}`);
                if (!res.ok) return;
                const config = await res.json();

                document.getElementById('val-screen').innerText = config.screenTv || '-';
                document.getElementById('val-pin').innerText = config.pin || '-';
                document.getElementById('val-mail').innerText = config.mail || '-';

                if (config.bgType === 'image' && config.bgImage) {
                    document.body.style.backgroundImage = `url('${config.bgImage}')`;
                } else if (config.bgColor) {
                    document.body.style.backgroundColor = config.bgColor;
                }

                if (config.logoUrl) {
                    document.getElementById('logo-container').innerHTML = `<img src="${config.logoUrl}" class="logo-img">`;
                } else if (config.mainColor) {
                    document.getElementById('logo-text').style.color = config.mainColor;
                }

                if (config.mainColor) {
                    document.getElementById('btn-goto-step2').style.backgroundColor = config.mainColor;
                }

                if (config.musicUrl) {
                    bgAudio.src = config.musicUrl;
                    document.getElementById('btn-music-step1').style.display = 'block';
                    document.getElementById('btn-music-step2').style.display = 'block';
                    
                    document.body.addEventListener('click', () => {
                        if (bgAudio.paused) bgAudio.play();
                    }, { once: true });
                }

                window.currentThemeConfig = config;

                // เช็กว่าเคยเริ่มนับเวลาไปแล้วหรือยัง (กรณีลูกค้ารีเฟรชหน้า Step 2)
                checkExistingTimer();
            } catch (err) {
                console.error('โหลดธีมไม่สำเร็จ:', err);
            }
        }

        function checkExistingTimer() {
            const startTimeKey = `timer_start_${currentToken}`;
            const savedStartTime = localStorage.getItem(startTimeKey);

            if (savedStartTime) {
                // หากเคยเริ่มกดปุ่มรับรหัสไปแล้ว ให้สลับเข้า Step 2 และนับเวลาต่อทันที
                document.getElementById('step1').style.display = 'none';
                document.getElementById('step2').style.display = 'flex';
                startCountdown(parseInt(savedStartTime, 10));
                loadEmails();
                setInterval(loadEmails, 10000);
            }
        }

        function goToStep2() {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'flex';

            const startTimeKey = `timer_start_${currentToken}`;
            let now = Date.now();
            localStorage.setItem(startTimeKey, now);

            startCountdown(now);
            loadEmails();
            setInterval(loadEmails, 10000);
        }

        function startCountdown(startTime) {
            if (countdownTimer) clearInterval(countdownTimer);

            const durationMs = EXPIRE_MINUTES * 60 * 1000;

            countdownTimer = setInterval(async () => {
                const now = Date.now();
                const elapsed = now - startTime;
                const remaining = durationMs - elapsed;

                if (remaining <= 0) {
                    clearInterval(countdownTimer);
                    document.getElementById('time-left').innerText = "00:00";
                    
                    // ทำลาย Token เมื่อหมดเวลา 15 นาที
                    await invalidateAndExpire();
                    return;
                }

                const minutes = Math.floor(remaining / (1000 * 60));
                const seconds = Math.floor((remaining % (1000 * 60)) / 1000);

                const formattedMin = String(minutes).padStart(2, '0');
                const formattedSec = String(seconds).padStart(2, '0');

                document.getElementById('time-left').innerText = `${formattedMin}:${formattedSec}`;
            }, 1000);
        }

        async function invalidateAndExpire() {
            try {
                await fetch('/api/invalidate-token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: currentToken })
                });
            } catch (e) {}
            
            localStorage.removeItem(`timer_start_${currentToken}`);
            window.location.reload(); // รีเฟรชเพื่อเปลี่ยนหน้าเป็น "❌ ลิงก์นี้หมดอายุแล้ว"
        }

        function toggleMusic() {
            const btn1 = document.getElementById('btn-music-step1');
            const btn2 = document.getElementById('btn-music-step2');
            if (bgAudio.paused) {
                bgAudio.play();
                btn1.innerText = '🔊 ปิดเพลง';
                btn2.innerText = '🔊 ปิดเพลง';
            } else {
                bgAudio.pause();
                btn1.innerText = '🔇 เปิดเพลง';
                btn2.innerText = '🔇 เปิดเพลง';
            }
        }

        function extractCode(text) {
            if (!text) return null;
            const keywordMatch = text.match(/(?:รหัส|code|verification|sign in|ยืนยัน)[\s\S]{0,30}?\b(\d{4,6})\b/i);
            if (keywordMatch) return keywordMatch[1];
            const standaloneMatch = text.match(/\b(\d{4}|\d{6})\b/);
            if (standaloneMatch) return standaloneMatch[1];
            return null;
        }

        async function copyCodeToClipboard(codeText) {
            try {
                await navigator.clipboard.writeText(codeText);

                await fetch('/api/invalidate-token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: currentToken })
                });

                localStorage.removeItem(`timer_start_${currentToken}`);

                const btn = document.getElementById('btn-copy');
                if (btn) {
                    btn.innerText = 'คัดลอกแล้ว (ลิงก์หมดอายุแล้ว) ✓';
                    btn.style.backgroundColor = '#2e7d32';
                    btn.style.boxShadow = 'none';
                    btn.disabled = true;
                }

                setTimeout(() => {
                    window.location.reload();
                }, 2000);

            } catch (err) {
                console.error('คัดลอกไม่สำเร็จ:', err);
            }
        }

        async function loadEmails() {
            try {
                const response = await fetch(`/api/emails/${currentToken}`);
                const emails = await response.json();
                
                const listDiv = document.getElementById('email-list');
                listDiv.innerHTML = '';

                if (!emails || emails.length === 0) {
                    listDiv.innerHTML = '<div class="inner-card"><p class="no-code">ไม่พบอีเมลรหัสยืนยันล่าสุด</p></div>';
                    return;
                }

                const latestEmail = emails[0];
                const textToScan = (latestEmail.subject || '') + " " + (latestEmail.body || '');
                const foundCode = extractCode(textToScan);

                const mainColor = (window.currentThemeConfig && window.currentThemeConfig.mainColor) ? window.currentThemeConfig.mainColor : '#ff0d19';

                const innerDiv = document.createElement('div');
                innerDiv.className = 'inner-card';

                if (foundCode) {
                    innerDiv.innerHTML = `
                        <div class="card-label">รหัสยืนยันล่าสุด</div>
                        <div class="netflix-code" style="color: ${mainColor}">${foundCode}</div>
                        <button id="btn-copy" class="copy-btn" style="background-color: ${mainColor}" onclick="copyCodeToClipboard('${foundCode}')">คัดลอกรหัส</button>
                        <div class="email-date">รับเมื่อ: ${new Date(latestEmail.date).toLocaleString('th-TH')}</div>
                    `;
                } else {
                    innerDiv.innerHTML = `
                        <div class="no-code">พบอีเมลล่าสุดแต่ไม่เจอรหัสตัวเลข</div>
                        <div class="email-date">รับเมื่อ: ${new Date(latestEmail.date).toLocaleString('th-TH')}</div>
                    `;
                }

                listDiv.appendChild(innerDiv);

            } catch (error) {
                document.getElementById('email-list').innerHTML = '<div class="inner-card"><p style="color:#ff0d19;">เชื่อมต่อเซิร์ฟเวอร์ไม่ได้</p></div>';
            }
        }

        loadTheme();
    </script>
</body>
</html>
