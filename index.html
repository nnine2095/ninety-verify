<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Code Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Prompt', sans-serif; 
            background: linear-gradient(135deg, #0f0f0f 0%, #1a0002 100%);
            color: #ffffff; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .container { 
            max-width: 420px; 
            width: 100%; 
            background: rgba(24, 24, 24, 0.85); 
            backdrop-filter: blur(10px); 
            padding: 35px 25px; 
            border-radius: 20px; 
            border: 1px solid rgba(229, 9, 20, 0.2); 
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7); 
            text-align: center; 
        }
        .logo { font-size: 28px; font-weight: 700; color: #E50914; letter-spacing: 1px; margin-bottom: 20px; text-transform: uppercase; }
        .email-card { background: #222222; border: 1px solid #333333; border-radius: 14px; padding: 25px 20px; margin-top: 10px; }
        .card-label { font-size: 14px; color: #aaaaaa; margin-bottom: 8px; }
        .netflix-code { font-size: 50px; font-weight: 700; color: #ffffff; letter-spacing: 8px; margin: 15px 0 20px 0; text-shadow: 0 0 15px rgba(229, 9, 20, 0.6); }
        .copy-btn { 
            background-color: #E50914; 
            color: #ffffff; 
            border: none; 
            padding: 12px 28px; 
            font-size: 16px; 
            font-weight: 600; 
            font-family: 'Prompt', sans-serif; 
            border-radius: 30px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            width: 100%; 
        }
        .copy-btn:hover { background-color: #ff0f1a; transform: translateY(-2px); }
        .email-date { font-size: 12px; color: #777777; margin-top: 18px; }
        .no-code { font-size: 15px; color: #888888; padding: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">NETFLIX CODE</div>
        <div id="email-list">กำลังรอดึงรหัส...</div>
    </div>

    <script>
        const currentToken = window.location.pathname.split('/').pop();

        function extractNetflixCode(text) {
            if (!text) return null;
            const keywordMatch = text.match(/(?:รหัส|code|verification|sign in|ยืนยัน)[\s\S]{0,30}?\b(\d{4,6})\b/i);
            if (keywordMatch) return keywordMatch[1];
            const standaloneMatch = text.match(/\b(\d{4}|\d{6})\b/);
            if (standaloneMatch) return standaloneMatch[1];
            return null;
        }

        async function copyCodeToClipboard(codeText) {
            try {
                await navigator.clipboard.writeText(codeText);

                await fetch('/api/invalidate-token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: currentToken })
                });

                const btn = document.getElementById('btn-copy');
                if (btn) {
                    btn.innerText = 'คัดลอกแล้ว (ลิงก์หมดอายุแล้ว) ✓';
                    btn.style.backgroundColor = '#2e7d32';
                    btn.disabled = true;
                }

                setTimeout(() => {
                    window.location.reload();
                }, 2000);

            } catch (err) {
                console.error('คัดลอกไม่สำเร็จ:', err);
            }
        }

        async function loadEmails() {
            try {
                const response = await fetch('/api/emails');
                const emails = await response.json();
                
                const listDiv = document.getElementById('email-list');
                listDiv.innerHTML = '';

                if (!emails || emails.length === 0) {
                    listDiv.innerHTML = '<p class="no-code">ไม่พบอีเมลรหัสยืนยันล่าสุดจาก Netflix</p>';
                    return;
                }

                const latestEmail = emails[0];
                const textToScan = (latestEmail.subject || '') + " " + (latestEmail.body || '');
                const foundCode = extractNetflixCode(textToScan);

                const emailDiv = document.createElement('div');
                emailDiv.className = 'email-card';

                if (foundCode) {
                    emailDiv.innerHTML = `
                        <div class="card-label">รหัสยืนยันล่าสุด</div>
                        <div class="netflix-code">${foundCode}</div>
                        <button id="btn-copy" class="copy-btn" onclick="copyCodeToClipboard('${foundCode}')">คัดลอกรหัส</button>
                        <div class="email-date">รับเมื่อ: ${new Date(latestEmail.date).toLocaleString('th-TH')}</div>
                    `;
                } else {
                    emailDiv.innerHTML = `
                        <div class="no-code">พบอีเมลจาก Netflix แต่ไม่เจอรหัสตัวเลข</div>
                        <div class="email-date">รับเมื่อ: ${new Date(latestEmail.date).toLocaleString('th-TH')}</div>
                    `;
                }

                listDiv.appendChild(emailDiv);

            } catch (error) {
                document.getElementById('email-list').innerHTML = '<p style="color:#E50914;">เชื่อมต่อเซิร์ฟเวอร์ไม่ได้</p>';
            }
        }

        loadEmails();
        setInterval(loadEmails, 10000);
    </script>
</body>
</html>
